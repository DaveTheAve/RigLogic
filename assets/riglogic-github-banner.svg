<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">RigLogic - Visit the official website</title>
  <desc id="desc">RigLogic. Built for Better Controls. Mostly. Free for Windows and Linux. Visit the official website.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131b"/>
      <stop offset="0.5" stop-color="#171827"/>
      <stop offset="1" stop-color="#24183b"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="18%" cy="35%" r="70%">
      <stop offset="0" stop-color="#8d58d5" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#8d58d5" stop-opacity=".06"/>
      <stop offset="1" stop-color="#8d58d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="83%" cy="17%" r="60%">
      <stop offset="0" stop-color="#7d4cc0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7d4cc0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0c2ff"/>
      <stop offset=".56" stop-color="#b583ff"/>
      <stop offset="1" stop-color="#7b49e6"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="1">
